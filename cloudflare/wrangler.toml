name = "esp-webcam-relay"
main = "worker.js"
compatibility_date = "2024-11-01"
# account_id intentionally NOT hardcoded here (keeps this file safe to make
# public later) - set it via the CLOUDFLARE_ACCOUNT_ID env var instead, see
# cloudflare/README.md.

[[r2_buckets]]
binding = "WEBCAM_BUCKET"
bucket_name = "esp-webcam"

# Hourly archive: the scheduled() handler copies each camera's latest.jpg
# into archive/<date>/<hour>.jpg. Declared here (not just in the dashboard)
# so that `wrangler deploy` does not remove the trigger.
[triggers]
crons = ["0 * * * *"]

# Upload secrets (not vars) - set them with:
#   npx wrangler secret put UPLOAD_TOKEN         # Ammersricht / ESP32-CAM
#   npx wrangler secret put UPLOAD_TOKEN_WEIDEN  # Weiden / Raspberry Pi
